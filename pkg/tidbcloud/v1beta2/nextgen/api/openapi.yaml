components:
  schemas:
    BackupTriggerType:
      description: |-
        The trigger type of a backup.

         - AUTO: The backup is triggered automatically by TiDB Cloud.
         - MANUAL: The backup is triggered manually by a user.
      enum:
      - AUTO
      - MANUAL
      type: string
    CmekAccessIamPrincipalAliyunCmekPrincipal:
      example:
        accountId: accountId
      properties:
        accountId:
          description: The Alibaba Cloud account ID of the CMEK IAM principal.
          readOnly: true
          type: string
      type: object
    CmekAccessIamPrincipalAwsCmekPrincipal:
      example:
        accountId: accountId
        externalId: externalId
      properties:
        accountId:
          description: The AWS account ID of the CMEK IAM principal.
          readOnly: true
          type: string
        externalId:
          description: |-
            The AWS STS AssumeRole `ExternalId` that must be pinned in the KMS
            key policy's `Condition` block when granting access to this principal.
          readOnly: true
          type: string
      type: object
    ConnectionReachabilityDetail:
      properties:
        serviceActive:
          description: Indicates whether the service is active.
          readOnly: true
          type: boolean
        endpointActive:
          description: Indicates whether the endpoint is active.
          readOnly: true
          type: boolean
        dnsReachable:
          description: Indicates whether the DNS is reachable.
          readOnly: true
          type: boolean
        message:
          description: A human-readable message that describes the reachability status.
          readOnly: true
          type: string
      type: object
    CustomerManagedEncryptionKeyAliyunKms:
      properties:
        kmsKeyArn:
          description: |-
            The Alibaba Cloud KMS key ARN used for encryption, e.g.
            `acs:kms:ap-southeast-1:5841052134823325:key/key-sgp68887a54phjt9703ut`.
          type: string
      required:
      - kmsKeyArn
      type: object
    CustomerManagedEncryptionKeyAwsKms:
      properties:
        kmsKeyArn:
          description: The Amazon Resource Name (ARN) of the AWS KMS key used for
            encryption.
          type: string
      required:
      - kmsKeyArn
      type: object
    EndpointConnectionType:
      enum:
      - PUBLIC
      - PRIVATE_ENDPOINT
      - VPC_PEERING
      type: string
    RegionCloudProvider:
      description: |-
        Enum of cloud provider names.

         - aws: Amazon Web Services.
         - gcp: Google Cloud Platform.
         - azure: Microsoft Azure.
         - alicloud: Alibaba Cloud.
      enum:
      - aws
      - gcp
      - azure
      - alicloud
      type: string
    ReservedCapacityScope:
      enum:
      - DEFAULT
      - ORG_PRIVATE
      type: string
    TidbDualLayerDataEncryption:
      description: "The dual-layer data encryption configuration for a TiDB Cloud\
        \ Premium instance. Specify exactly one of the following options: `noEncryption`,\
        \ `defaultKey`, or `cmek`."
      properties:
        noEncryption:
          description: Disables dual-layer data encryption. The TiDB Cloud Premium
            instance uses the default encryption provided by the cloud provider.
          properties: {}
          type: object
        defaultKey:
          description: Enables dual-layer data encryption using the TiDB Cloud default
            key.
          properties: {}
          type: object
        cmek:
          allOf:
          - $ref: '#/components/schemas/v1beta2CustomerManagedEncryptionKey'
          description: |-
            Enables dual-layer data encryption using a customer-managed encryption key (CMEK).
            Configure the key according to the cloud provider:
            - AWS: set `awsKms` and `awsPrincipal`.
            - Alibaba Cloud: set `aliyunKms` and `aliyunPrincipal`.
          type: object
      type: object
    TidbEndpoint:
      example:
        port: 0
        egressIps:
        - egressIps
        - egressIps
        host: host
        connectionReachability: "{}"
        connectionType: "{}"
      properties:
        host:
          description: |-
            The hostname of the endpoint.

            When `connectionType` is `"PRIVATE_ENDPOINT"`, the behavior of the `host` field varies by cloud provider:
            - For AWS, this field is available after the Private Link service is ready.
            - For Google Cloud and Azure, this field is available after you create a private endpoint connection.
          readOnly: true
          type: string
        port:
          description: The port number of the endpoint.
          format: int32
          readOnly: true
          type: integer
        connectionType:
          allOf:
          - $ref: '#/components/schemas/EndpointConnectionType'
          description: |-
            The connection type of the endpoint.

            - `PUBLIC`: a public endpoint. For more information, see [Network](https://docs.pingcap.com/tidbcloud/connect-to-tidb-instance/#network).

            - `PRIVATE_ENDPOINT`: a private endpoint. For more information, see [Network](https://docs.pingcap.com/tidbcloud/connect-to-tidb-instance/#network).

            - `VPC_PEERING`: a VPC peering endpoint (not yet supported, planned for a future release).
          type: object
        connectionReachability:
          allOf:
          - $ref: '#/components/schemas/v1beta2ConnectionReachability'
          description: The reachability status of the endpoint connection.
          type: object
        egressIps:
          description: |-
            The public egress IP addresses used by the TiDB Cloud Premium instance.

            This field is returned only for public endpoints. You can use these IP addresses
            to configure allowlists on upstream services when connecting through a public endpoint.
          items:
            type: string
          readOnly: true
          type: array
      type: object
    TidbServiceResetRootPasswordBody:
      example:
        rootPassword: my-shining-password
      properties:
        rootPassword:
          description: |-
            The new root password.

            This field supports two input formats:
            - Plaintext password (legacy behavior)
            - RSA-OAEP-SHA256 encrypted payload prefixed with `rsa_oaep_sha256:`

            If the marker prefix is present, the server parses and decrypts the encrypted payload.
            Any parse/decrypt failure returns an explicit parameter error without plaintext fallback.
            If the marker prefix is absent, the value is treated as plaintext for backward compatibility.

            For plaintext input, the password must be between 8 and 64 characters long.
          example: my-shining-password
          pattern: "^(rsa_oaep_sha256:.+|.{8,64})$"
          type: string
      required:
      - rootPassword
      type: object
    nextgenv1beta2Tidb:
      example:
        tidbId: tidbId
        displayName: foo-bar
        minRcu: minRcu
        annotations:
          key: annotations
        automaticResumeAt: 2000-01-23T04:56:07.000+00:00
        capacityMode: "{}"
        capacityUpdateTime: 2000-01-23T04:56:07.000+00:00
        cloudProvider: "{}"
        state: "{}"
        dualLayerDataEncryption: "{}"
        rootPassword: my-shining-password
        baselineRcu: baselineRcu
        reservedCapacity: "{}"
        reservedCapacityTemplateId: reservedCapacityTemplateId
        creator: creator
        endpoints:
        - port: 0
          egressIps:
          - egressIps
          - egressIps
          host: host
          connectionReachability: "{}"
          connectionType: "{}"
        - port: 0
          egressIps:
          - egressIps
          - egressIps
          host: host
          connectionReachability: "{}"
          connectionType: "{}"
        resourcePoolDisplayName: resourcePoolDisplayName
        updateTime: 2000-01-23T04:56:07.000+00:00
        maxRcu: maxRcu
        labels:
          key: labels
        tags:
        - tags
        - tags
        regionDisplayName: regionDisplayName
        servicePlan: "{}"
        regionId: regionId
        createTime: 2000-01-23T04:56:07.000+00:00
        resourcePoolId: resourcePoolId
        highAvailabilityType: "{}"
        name: name
        tidbVersion: tidbVersion
      properties:
        name:
          description: "The unique identifier for the TiDB Cloud Premium instance,\
            \ which is generated by the API and follows the format `tidbs/{tidbId}`."
          readOnly: true
          type: string
        tidbId:
          description: The ID of the TiDB Cloud Premium instance.
          readOnly: true
          type: string
        displayName:
          description: The user-defined name of the TiDB Cloud Premium instance.
          example: foo-bar
          maxLength: 64
          minLength: 4
          pattern: "^[A-Za-z0-9][-A-Za-z0-9]{2,62}[A-Za-z0-9]$"
          type: string
        regionId:
          description: "The unique identifier of the region where the TiDB Cloud Premium\
            \ instance is deployed, in the format of `{cloud_provider}-{region_code}`.\
            \ For example, `aws-us-west-2`."
          type: string
        cloudProvider:
          allOf:
          - $ref: '#/components/schemas/RegionCloudProvider'
          description: |-
            The cloud provider where the TiDB Cloud Premium instance is deployed.

            - `"aws"`: Amazon Web Services

            - `"gcp"`: Google Cloud

            - `"azure"`: Microsoft Azure

            - `"alicloud"`: Alibaba Cloud
          type: object
        regionDisplayName:
          description: "The display name of the region where the TiDB Cloud Premium\
            \ instance is deployed. For example, `Oregon (us-west-2)`."
          readOnly: true
          type: string
        state:
          allOf:
          - $ref: '#/components/schemas/v1beta1ClusterState'
          description: The current state of the TiDB Cloud Premium instance.
          type: object
        rootPassword:
          description: |-
            The root password of the TiDB Cloud Premium instance.

            This field supports two input formats:
            - Plaintext password (legacy behavior)
            - RSA-OAEP-SHA256 encrypted payload prefixed with `rsa_oaep_sha256:`

            If the marker prefix is present, the server parses and decrypts the encrypted payload.
            Any parse/decrypt failure returns an explicit parameter error without plaintext fallback.
            If the marker prefix is absent, the value is treated as plaintext for backward compatibility.

            For plaintext input, the password must be between 8 and 64 characters long and can contain letters,
            numbers, and special characters.
          example: my-shining-password
          pattern: "^(rsa_oaep_sha256:.+|.{8,64})$"
          type: string
        minRcu:
          description: |-
            The minimum number of Request Capacity Units (RCUs) for the TiDB Cloud Premium instance.

            This field is read-only and is calculated by the service. It is omitted in Elastic Mode,
            where Baseline RCU is the provisioning and billing floor.
          format: int64
          nullable: true
          readOnly: true
          type: string
        maxRcu:
          description: |-
            The customer-defined maximum number of Request Capacity Units (RCUs). Requirements depend on service_plan:
            - Premium and Essential_V2: optional. A positive value selects Max RCU Compatibility Mode. Omitting both
              max_rcu and baseline_rcu selects Elastic Mode with the plan default Baseline RCU: 5,000 for Premium and
              2,000 for Essential_V2.
            - BYOC: required and must be greater than zero.
            - Premium_Reserved: must be omitted.
            Zero and JSON null are treated as omission and are not clear operations.
          format: int64
          nullable: true
          type: string
        servicePlan:
          allOf:
          - $ref: '#/components/schemas/v1beta1ServicePlan'
          description: |-
            The plan of the service.

            - `Premium`: [TiDB Cloud Premium](https://docs.pingcap.com/tidbcloud/select-cluster-tier/#tidb-cloud-premium)

            - `Premium_Reserved`: TiDB Cloud Premium Reserved
          type: object
        reservedCapacityTemplateId:
          description: |-
            The capacity template ID for Premium Reserved. This field is only accepted
            when `service_plan` is `Premium_Reserved`; it is not returned in responses.
          format: int64
          type: string
        reservedCapacity:
          allOf:
          - $ref: '#/components/schemas/v1beta2ReservedCapacity'
          description: |-
            The current Reserved capacity information. This field is only returned for
            Premium Reserved instances.
          type: object
        resourcePoolId:
          description: |-
            The resource pool selected for this TiDB Cloud instance.
            Currently, this field is only used for TiDB Cloud BYOC instances.
          nullable: true
          type: string
        resourcePoolDisplayName:
          description: |-
            The current display name of the selected resource pool.
            Currently, this field is only returned for TiDB Cloud BYOC instances.
          nullable: true
          readOnly: true
          type: string
        highAvailabilityType:
          allOf:
          - $ref: '#/components/schemas/v1beta2TidbHighAvailabilityType'
          description: |-
            The high availability configuration for the TiDB Cloud instance.
            - `REGIONAL`: high availability across multiple availability zones within a region. For more information, see [Regional high availability architecture](https://docs.pingcap.com/tidbcloud/serverless-high-availability/#regional-high-availability-architecture).
            - `ZONAL`: high availability within a single availability zone. For more information, see [Zonal high availability architecture](https://docs.pingcap.com/tidbcloud/serverless-high-availability/#zonal-high-availability-architecture).
            TiDB Cloud Premium and Premium Reserved support only `REGIONAL`.
            If omitted for TiDB Cloud Essential, the selected resource pool determines the value.
          type: object
        annotations:
          additionalProperties:
            type: string
          description: |-
            The annotations for the TiDB Cloud Premium instance. The following lists some predefined annotations:
