  /tidbs/{tidbId}:resumeTidb:
    post:
      description: Accepts an asynchronous request to resume a paused TiDB Cloud Premium
        or Premium Reserved instance. Resuming an instance resumes its underlying
        resource pool and every instance in that pool. Poll the instance state with
        GetTidb to observe completion.
      operationId: TidbService_ResumeTidb
      parameters:
      - description: The ID of a paused TiDB Cloud Premium or Premium Reserved instance.
        in: path
        name: tidbId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1beta2ResumeTidbResponse'
          description: A successful response.
        "400":
          content:
