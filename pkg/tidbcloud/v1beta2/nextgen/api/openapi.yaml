          description: Internal server error.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: An unexpected error response.
      summary: Resume a TiDB Cloud Premium instance
      tags:
      - TiDB Cloud Premium Instance
  /tidbs/{tidb.tidbId}:
    patch:
      description: "Updates the configuration of a specific TiDB Cloud Premium instance.\
        \ You can modify the following fields: `displayName` and `maxRcu`."
      operationId: TidbService_UpdateTidb
      parameters:
      - description: The ID of the TiDB Cloud Premium instance to update.
        in: path
        name: tidb.tidbId
        required: true
        schema:
          type: string
      - description: "If set to `true`, the request is validated but not executed.\
          \ Defaults to `false`."
        in: query
        name: validateOnly
        schema:
          type: boolean
      requestBody:
        content:
