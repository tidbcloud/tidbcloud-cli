          description: |-
            The cloud provider that offers the region.

            - `"aws"`: Amazon Web Services

            - `"gcp"`: Google Cloud

            - `"azure"`: Microsoft Azure

            - `"alicloud"`: Alibaba Cloud
          example: aws
          type: object
        displayName:
          description: "A human-readable name for the region. For example, `Oregon\
            \ (us-west-2)`."
          example: Oregon (us-west-2)
          readOnly: true
          type: string
        provider:
          description: "**Deprecated.** Use `cloudProvider` instead. The name of the\
            \ cloud provider. For example, `aws`, `gcp`, `azure`, or `alicloud`."
          example: aws
          nullable: true
          readOnly: true
          title: Deprecated
          type: string
        servicePlans:
          description: "The service plans available in this region. Premium, Essential_V2,\
            \ and Premium_Reserved can appear together in the same logical region.\
            \ Starter, Essential, and BYOC are standalone service plans and cannot\
            \ share a logical region with any other service plan."
