            - `tidb.cloud/available-features`: lists available features of the TiDB Cloud Premium instance.
          type: object
        labels:
          additionalProperties:
            type: string
          description: |-
            The labels for the TiDB Cloud Premium instance.
            - `tidb.cloud/organization`: the ID of the organization where the TiDB Cloud Premium instance belongs.
            - `tidb.cloud/project`: the ID of the project where the TiDB Cloud Premium instance belongs.
          type: object
        creator:
          description: The email address or public API key of the user who created
            the TiDB Cloud Premium instance.
          readOnly: true
          type: string
        createTime:
          description: "The timestamp when the TiDB Cloud Premium instance was created,\
            \ in the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format."
          format: date-time
          readOnly: true
          type: string
        updateTime:
          description: "The timestamp when the TiDB Cloud Premium instance was last\
            \ updated, in the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format."
          format: date-time
          readOnly: true
          type: string
        automaticResumeAt:
          description: |-
            The scheduled time when the Resource Pool will automatically resume this instance's pool.
            This field is set only while the Resource Pool is paused.
          format: date-time
          readOnly: true
          type: string
        endpoints:
          description: The connection endpoints for accessing the TiDB Cloud Premium
            instance.
          items:
            $ref: '#/components/schemas/TidbEndpoint'
          readOnly: true
          type: array
        dualLayerDataEncryption:
          allOf:
          - $ref: '#/components/schemas/TidbDualLayerDataEncryption'
          description: The dual-layer data encryption configuration for the TiDB Cloud
            Premium instance.
          type: object
        tidbVersion:
          description: The version of the TiDB instance.
          readOnly: true
          type: string
        tags:
          items:
            type: string
          type: array
        capacityUpdateTime:
          description: "The timestamp when the capacity of the TiDB Cloud Premium\
            \ instance was last updated, in the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)\
            \ format."
          format: date-time
          readOnly: true
          type: string
        baselineRcu:
          description: |-
            The optional guaranteed provisioning commitment in Elastic Mode. Premium accepts
            5,000, 12,500, or 50,000 RCU. Essential_V2 uses a fixed 2,000 RCU baseline.
            When neither max_rcu nor baseline_rcu is positive during creation, the service uses the
            plan default. Zero and JSON null are treated as omission. This field cannot be configured
            to a positive value together with a positive max_rcu.
          format: int64
          nullable: true
          type: string
        capacityMode:
          allOf:
          - $ref: '#/components/schemas/TidbCapacityMode'
          description: |-
            The effective customer-facing capacity mode for Premium and Essential_V2.
            Other service plans, or capacity records that do not identify exactly one supported mode,
            return CAPACITY_MODE_UNSPECIFIED.
          type: object
      required:
      - displayName
      - regionId
      - servicePlan
      type: object
    protobufAny:
      additionalProperties:
        type: object
      description: |-
        `Any` contains an arbitrary serialized protocol buffer message along with a
        URL that describes the type of the serialized message.

        Protobuf library provides support to pack/unpack Any values in the form
        of utility functions or additional generated methods of the Any type.

        Example 1: Pack and unpack a message in C++.

            Foo foo = ...;
            Any any;
            any.PackFrom(foo);
            ...
            if (any.UnpackTo(&foo)) {
              ...
            }

        Example 2: Pack and unpack a message in Java.

            Foo foo = ...;
            Any any = Any.pack(foo);
            ...
            if (any.is(Foo.class)) {
              foo = any.unpack(Foo.class);
            }
            // or ...
            if (any.isSameTypeAs(Foo.getDefaultInstance())) {
              foo = any.unpack(Foo.getDefaultInstance());
            }

         Example 3: Pack and unpack a message in Python.

            foo = Foo(...)
            any = Any()
            any.Pack(foo)
            ...
            if any.Is(Foo.DESCRIPTOR):
              any.Unpack(foo)
              ...

         Example 4: Pack and unpack a message in Go

             foo := &pb.Foo{...}
             any, err := anypb.New(foo)
             if err != nil {
               ...
             }
             ...
             foo := &pb.Foo{}
             if err := any.UnmarshalTo(foo); err != nil {
               ...
             }

        The pack methods provided by protobuf library will by default use
        'type.googleapis.com/full.type.name' as the type URL and the unpack
        methods only use the fully qualified type name after the last '/'
        in the type URL, for example "foo.bar.com/x/y.z" will yield type
        name "y.z".

        JSON
        ====
        The JSON representation of an `Any` value uses the regular
        representation of the deserialized, embedded message, with an
        additional field `@type` which contains the type URL. Example:

            package google.profile;
            message Person {
              string first_name = 1;
              string last_name = 2;
            }

            {
              "@type": "type.googleapis.com/google.profile.Person",
              "firstName": <string>,
              "lastName": <string>
            }

        If the embedded message type is well-known and has a custom JSON
        representation, that representation will be embedded adding a field
        `value` which holds the custom JSON in addition to the `@type`
        field. Example (for message [google.protobuf.Duration][]):

            {
              "@type": "type.googleapis.com/google.protobuf.Duration",
              "value": "1.212s"
            }
      example:
        '@type': '@type'
      properties:
        '@type':
          description: A URL or resource name that uniquely identifies the type of
            the serialized protocol buffer message.
          type: string
      type: object
    rpcStatus:
      description: |-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It is
        used by [gRPC](https://github.com/grpc). Each `Status` message contains
        three pieces of data: error code, error message, and error details.

        You can find out more about this error model and how to work with it in the
        [API Design Guide](https://cloud.google.com/apis/design/errors).
      example:
        code: 0
        details:
        - '@type': '@type'
        - '@type': '@type'
        message: message
      properties:
        code:
          description: The error code returned with this error.
          format: int32
          type: integer
        message:
          description: The error message returned with this error.
          type: string
        details:
          description: A list of messages with additional error details.
          items:
            $ref: '#/components/schemas/protobufAny'
          type: array
      type: object
    v1beta1ClusterState:
      description: |-
        Enum of possible states of a cluster.

         - CREATING: Cluster is being created.
         - DELETING: Cluster is being deleted.
         - ACTIVE: Cluster is active for use.
         - RESTORING: Cluster data is being restored.
         - MAINTENANCE: Cluster is under maintenance.
         - DELETED: Cluster has been deleted.
         - INACTIVE: Cluster is not active, but not being deleted.
         - UPGRADING: Cluster is being updated.
        Only for Dedicated Cluster.
         - IMPORTING: Cluster is being imported.
        Only for Dedicated Cluster.
         - MODIFYING: Cluster is being modified.
        Only for Dedicated Cluster.
         - PAUSING: Cluster is being paused.
        Only for Dedicated Cluster.
         - PAUSED: Cluster is paused.
        Only for Dedicated Cluster.
         - RESUMING: Cluster is resuming.
        Only for Dedicated Cluster.
      enum:
      - CREATING
      - DELETING
      - ACTIVE
      - RESTORING
      - MAINTENANCE
      - DELETED
      - INACTIVE
      - UPGRADING
      - IMPORTING
      - MODIFYING
      - PAUSING
      - PAUSED
      - RESUMING
      type: string
    v1beta1EngineType:
      enum:
      - MYSQL_COMPATIBLE
      - POSTGRESQL_COMPATIBLE
      type: string
    v1beta1Region:
