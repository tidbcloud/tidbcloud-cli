openapi: 3.0.1
info:
  description: "*TiDB Cloud API is in beta.*\n\nThis API manages [TiDB Cloud Premium](https://docs.pingcap.com/tidbcloud/select-cluster-tier/#tidb-cloud-premium)\
    \ instances. For more information about TiDB Cloud API, see [TiDB Cloud API Overview](https://docs.pingcap.com/api/tidb-cloud-api-overview/).\n\
    \nThe public connection setting endpoints also support TiDB Cloud Essential V2\
    \ instances.\n\n# Overview\n\nThe TiDB Cloud Premium API (v1beta2) provides [REST](https://en.wikipedia.org/wiki/REST)\
    \ endpoints to manage TiDB Cloud Premium instances and related resources.\n\n\
    You can use this API to manage the following resources:\n\n- **TiDB Cloud Premium\
    \ instance**: manage the lifecycle and configuration of TiDB Cloud Premium instances,\
    \ including passwords, CA certificates, and cloud provider information.\n- **Public\
    \ connection setting**: enable or disable public connections and manage IP access\
    \ lists for Premium and Essential V2 instances.\n- **Customer-managed encryption\
    \ key**: retrieve the IAM principal and verify KMS access before creating a Premium\
    \ instance on AWS or Alibaba Cloud.\n- **Backup**: manage backups for TiDB Cloud\
    \ Premium instances, including backup-based restore.\n- **Region**: retrieve available\
    \ regions for deploying TiDB Cloud Premium instances.\n\n# Get Started\n\nThis\
    \ guide helps you make your first API call to the TiDB Cloud Premium API. You\
    \ will learn how to authenticate a request, build a request, and interpret the\
    \ response.\n\n1. Create a [TiDB Cloud account](https://tidbcloud.com/signup)\
    \ if you do not already have one.\n2. In the [TiDB Cloud console](https://tidbcloud.com/),\
    \ go to **Organization** > **API Keys** and create an API key. For more information,\
    \ see [API key management](#section/Authentication/API-key-management).\n3. Make\
    \ your first API call.\n\n\tTo get all TiDB Cloud Premium instances in your organization,\
    \ run the following command in your terminal. Replace `YOUR_PUBLIC_KEY` and `YOUR_PRIVATE_KEY`\
    \ with your own key values.\n\n\t```bash\n\tcurl --digest \\\n\t  --user 'YOUR_PUBLIC_KEY:YOUR_PRIVATE_KEY'\
    \ \\\n\t  --request GET \\\n\t  --url 'https://cloud.tidbapi.com/v1beta2/tidbs'\
    \ \\\n\t  --header 'Accept: application/json'\n\t```\n\n4. The API returns a JSON\
    \ list of your TiDB Cloud Premium instances. If none exist, the response contains\
    \ an empty list.\n\n# Authentication\n\nThe TiDB Cloud API supports [HTTP Digest\
    \ Authentication](https://en.wikipedia.org/wiki/Digest_access_authentication)\
    \ with API keys and OAuth Bearer tokens. OAuth clients send the token in the `Authorization:\
    \ Bearer <token>` header. It protects your private key from being sent over the\
    \ network. For more details about HTTP Digest Authentication, refer to the [IETF\
    \ RFC](https://datatracker.ietf.org/doc/html/rfc7616).\n\n## API key overview\n\
    \n- The API key contains a public key and a private key, which act as the username\
    \ and password required in the HTTP Digest Authentication. The private key only\
    \ displays upon the key creation.\n- The API key belongs to your organization\
    \ and acts as the `Organization Owner` role. You can check [permissions of owner](https://docs.pingcap.com/tidbcloud/manage-user-access#configure-member-roles).\n\
    - You must provide the correct API key in every request. Otherwise, TiDB Cloud\
    \ responds with a `401` error.\n\n## API key management\n\n### Create an API key\n\
    \nOnly the **owner** of an organization can create an API key.\n\nTo create an\
    \ API key in an organization, perform the following steps:\n\n1. In the [TiDB\
    \ Cloud console](https://tidbcloud.com), switch to your target organization using\
    \ the combo box in the upper-left corner.\n2. In the left navigation pane, click\
    \ **Organization Settings** > **API Keys**.\n3. On the **API Keys** page, click\
    \ **Create API Key**.\n4. Enter a description for your API key.\n5. Configure\
    \ the role and scope for the API key. For more information about the permissions\
    \ of a role, see [User roles](https://docs.pingcap.com/tidbcloud/manage-user-access/#user-roles).\n\
    6. Click **Generate API Key**. Copy and save the public key and the private key.\n\
    7. Make sure that you have copied and saved the private key in a secure location.\
    \ The private key only displays upon the creation. After leaving this page, you\
    \ will not be able to get the full private key again.\n8. Click **Done**.\n\n\
    ### View details of an API key\n\nTo view details of an API key, perform the following\
    \ steps:\n\n1. In the [TiDB Cloud console](https://tidbcloud.com), switch to your\
    \ target organization using the combo box in the upper-left corner.\n2. In the\
    \ left navigation pane, click **Organization Settings** > **API Keys**.\n3. You\
    \ can view the details of the API keys on the page.\n\n### Edit an API key\n\n\
    Only the **owner** of an organization can modify an API key.\n\nTo edit an API\
    \ key in an organization, perform the following steps:\n\n1. In the [TiDB Cloud\
    \ console](https://tidbcloud.com), switch to your target organization using the\
    \ combo box in the upper-left corner.\n2. In the left navigation pane, click **Organization\
    \ Settings** > **API Keys**.\n3. On the **API Keys** page, click **...** in the\
    \ API key row that you want to change, and then click **Update Role**.\n4. You\
    \ can update the description and role of the API key.\n5. Click **Update**.\n\n\
    ### Delete an API key\n\nOnly the **owner** of an organization can delete an API\
    \ key.\n\nTo delete an API key in an organization, perform the following steps:\n\
    \n1. In the [TiDB Cloud console](https://tidbcloud.com), switch to your target\
    \ organization using the combo box in the upper-left corner.\n2. In the left navigation\
    \ pane, click **Organization Settings** > **API Keys**.\n3. On the **API Keys**\
    \ page, click **...** in the API key row that you want to delete, and then click\
    \ **Delete**.\n4. Click **I understand, delete it.**\n\n# API Changelog\n\nThis\
    \ changelog lists all changes to the TiDB Cloud Premium API (v1beta2).\n\n<!--\
    \ In reverse chronological order -->\n\n## 20260924\n\n- Published CMEK IAM principal\
    \ retrieval and verification APIs for Premium instances on AWS and Alibaba Cloud.\n\
    \n## 20260923\n\n- Added APIs to get and update public connection settings for\
    \ Premium and Essential V2 instances.\n\n## 20260428\n\n- Initial release of the\
    \ TiDB Cloud Premium API (v1beta2), including the following resources and endpoints:\n\
    \t* TiDB Cloud Premium instance\n\t\t* [List TiDB Cloud Premium instances](#tag/TiDB-Instance/operation/TidbService_ListTidbs)\n\
    \t\t* [Create a TiDB Cloud Premium instance](#tag/TiDB-Instance/operation/TidbService_CreateTidb)\n\
    \t\t* [Get a TiDB Cloud Premium instance](#tag/TiDB-Instance/operation/TidbService_GetTidb)\n\
    \t\t* [Delete a TiDB Cloud Premium instance](#tag/TiDB-Instance/operation/TidbService_DeleteTidb)\n\
    \t\t* [Update a TiDB Cloud Premium instance](#tag/TiDB-Instance/operation/TidbService_UpdateTidb)\n\
    \t\t* [Reset the root password of a TiDB Cloud Premium instance](#tag/TiDB-Instance/operation/TidbService_ResetRootPassword)\n\
    \t\t* [Get cloud provider information for a TiDB Cloud Premium instance](#tag/TiDB-Instance/operation/TidbService_GetCloudProviderInfo)\n\
    \t\t* [Get the CA certificate download URL for a TiDB Cloud Premium instance](#tag/TiDB-Instance/operation/TidbService_GetCaCertificateDownloadUrl)\n\
    \t* Backup\n\t\t* [List backups for a TiDB Cloud Premium instance](#tag/Backup/operation/TidbService_ListTidbBackups)\n\
    \t\t* [Delete a backup for a TiDB Cloud Premium instance](#tag/Backup/operation/TidbService_DeleteTidbBackup)\n\
    \t\t* [Restore a TiDB Cloud Premium instance from a backup](#tag/Backup/operation/TidbService_RestoreTidb)\n\
    \t\t* [Get restore status for a TiDB Cloud Premium instance](#tag/Backup/operation/TidbService_GetRestoreStatus)\n\
    \t* Region\n\t\t* [List regions](#tag/Region/operation/RegionService_ListRegions)\n"
  title: TiDB Cloud Premium API
  version: v1beta2
servers:
- url: https://cloud.tidbapi.com/v1beta2
tags:
- description: "Manage the lifecycle and configuration of TiDB Cloud Premium instances,\
    \ including passwords, CA certificates, and cloud provider information."
  name: TiDB Cloud Premium Instance
- description: Enable or disable public connections and manage IP access lists for
    Premium and Essential V2 instances.
  name: PublicConnectionSettingService
- description: Retrieve the IAM principal and verify customer-managed KMS access for
    Premium instances on AWS or Alibaba Cloud.
  name: CustomerManagedEncryptionKeyService
- description: "Manage backups for TiDB Cloud Premium instances, including backup-based\
    \ restore."
  name: Backup
- description: Retrieve available regions for deploying TiDB Cloud Premium instances.
  name: Region
- description: Retrieve existing private connection addresses for Premium and Essential
    V2 instances.
  name: PrivateEndpointConnectionService
paths:
  /cmeks:principal:
    get:
      description: Retrieves the IAM principal required for customer-managed encryption
        key (CMEK) access. Use this to get the TiDB Cloud account information needed
        to configure your KMS key policy.
      operationId: CustomerManagedEncryptionKeyService_GetCmekAccessIamPrincipal
      parameters:
      - description: "The region of the Premium instance, for example `aws-us-west-2`."
        in: query
        name: regionId
        required: true
        schema:
          type: string
      - in: query
        name: servicePlan
        required: true
        schema:
          $ref: '#/components/schemas/TidbService_ListTidbs_servicePlan_parameter'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1beta2CmekAccessIamPrincipal'
          description: A successful response.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: A request field is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: The credentials cannot be authenticated.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: The authenticated identity does not have permission to access
            the resource.
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: You have exceeded the rate limit.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: Internal server error.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: An unexpected error response.
      summary: Get CMEK IAM principal
      tags:
      - CustomerManagedEncryptionKeyService
  /cmeks:verifyPrincipal:
    post:
      description: Verifies that the CMEK IAM principal configuration is valid. Use
        this to validate your KMS key policy before creating a TiDB Cloud Premium
        instance with CMEK enabled.
      operationId: CustomerManagedEncryptionKeyService_VerifyCmekAccessIamPrincipal
      parameters:
      - description: |-
          Optional existing TiDB ID. Omit this when validating CMEK before creating
          a TiDB; provide it when validating CMEK for an existing TiDB.
        in: query
        name: tidbId
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1beta2CustomerManagedEncryptionKey'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1beta2VerifyCmekAccessIamPrincipalResponse'
          description: A successful response.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: A request field is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: The credentials cannot be authenticated.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: The authenticated identity does not have permission to access
            the resource.
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: You have exceeded the rate limit.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: Internal server error.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: An unexpected error response.
      summary: Verify CMEK IAM principal
      tags:
      - CustomerManagedEncryptionKeyService
      x-codegen-request-body-name: key
  /tidbs:
    get:
      description: "Lists all TiDB Cloud Premium instances in your organization. You\
        \ can filter results by service plan, region, name, or ID."
      operationId: TidbService_ListTidbs
      parameters:
      - description: |-
          The plan of the service. If specified, only TiDB Cloud Premium instances of the specified plan are returned.

          - `Premium`: [TiDB Cloud Premium](https://docs.pingcap.com/tidbcloud/select-cluster-tier/#tidb-cloud-premium)

          - `Premium_Reserved`: TiDB Cloud Premium Reserved
        in: query
        name: servicePlan
        schema:
          $ref: '#/components/schemas/TidbService_ListTidbs_servicePlan_parameter'
      - description: "A list of region IDs. If specified, only TiDB Cloud Premium\
          \ instances in these regions are returned."
        explode: true
        in: query
        name: regionIds
        schema:
          items:
            type: string
          type: array
        style: form
      - description: "The display name to filter by. If specified, only TiDB Cloud\
          \ Premium instances whose display name contains this value are returned."
        in: query
        name: name
        schema:
          type: string
      - description: "A list of tags. If specified, only TiDB Cloud Premium instances\
          \ tagged with any of these values are returned."
        explode: true
        in: query
        name: tags
        schema:
          items:
            type: string
          type: array
        style: form
      - description: "A list of TiDB Cloud Premium instance IDs. If specified, only\
          \ the ones matching these IDs are returned."
        explode: true
        in: query
        name: tidbIds
        schema:
          items:
            type: string
          type: array
        style: form
      - description: "A list of resource pool IDs. If specified, only TiDB Cloud BYOC\
          \ instances in these resource pools are returned."
        explode: true
        in: query
        name: resourcePoolIds
        schema:
          items:
            type: string
          type: array
        style: form
      - description: "The maximum number of TiDB Cloud Premium instances to return.\
          \ If not specified, at most 10 will be returned. The maximum value is `100`.\
          \ Values greater than `100` are set to `100`."
        in: query
        name: pageSize
        schema:
          default: 10
          format: int32
          type: integer
      - description: |-
          The pagination token received from a previous [List TiDB Cloud Premium instances](#tag/TiDB-Instance/operation/TidbService_ListTidbs) request. Use this token to retrieve the next page of results.

          **Note**: When paginating, all other parameters must match the original request.
        in: query
        name: pageToken
        schema:
          type: string
      - description: "The number of TiDB Cloud Premium instances to skip before returning\
          \ results. If the value exceeds the total number of TiDB Cloud Premium instances,\
          \ the response is `200` with an empty list and no `nextPageToken`."
        in: query
        name: skip
        schema:
          format: int32
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1beta2ListTidbsResponse'
          description: A successful response.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: A request field is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: The credentials cannot be authenticated.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: The authenticated identity does not have permission to access
            the resource.
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: You have exceeded the rate limit.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: Internal server error.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: An unexpected error response.
      summary: List TiDB Cloud Premium instances
      tags:
      - TiDB Cloud Premium Instance
      x-code-samples:
      - label: curl
        lang: curl
        source: |-
          curl --location 'https://cloud.tidbapi.com/v1beta2/tidbs' \
          --digest --user 'YOUR_PUBLIC_KEY:YOUR_PRIVATE_KEY' \
          --header 'Accept: application/json'
    post:
      description: "Creates a new TiDB Cloud Premium instance. If the `tidb.cloud/project`\
        \ label is provided, the instance will be created in the specified project."
      operationId: TidbService_CreateTidb
      parameters:
      - description: "If set to `true`, the request is validated but not executed.\
          \ Defaults to `false`."
        in: query
        name: validateOnly
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/nextgenv1beta2Tidb'
        description: The TiDB Cloud Premium instance to create.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nextgenv1beta2Tidb'
          description: A successful response.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: A request field is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: The credentials cannot be authenticated.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: The authenticated identity does not have permission to access
            the resource.
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: You have exceeded the rate limit.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: Internal server error.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: An unexpected error response.
      summary: Create a TiDB Cloud Premium instance
      tags:
      - TiDB Cloud Premium Instance
      x-code-samples:
      - label: curl
        lang: curl
        source: |-
          curl --location 'https://cloud.tidbapi.com/v1beta2/tidbs' \
          --digest --user 'YOUR_PUBLIC_KEY:YOUR_PRIVATE_KEY' \
          --header 'Content-Type: application/json' \
          --header 'Accept: application/json' \
          --data '{
            "displayName": "my-tidb",
            "regionId": "aws-us-west-2",
            "maxRcu": 20000,
            "servicePlan": "Premium"
          }'
      x-codegen-request-body-name: tidb
  /tidbs/{tidbId}:
    delete:
      description: Deletes a TiDB Cloud Premium instance by `tidbId`.
      operationId: TidbService_DeleteTidb
      parameters:
      - description: The ID of the TiDB Cloud Premium instance to delete.
        in: path
        name: tidbId
        required: true
        schema:
          type: string
      - description: "If set to `true`, the request is validated but not executed.\
          \ Defaults to `false`."
        in: query
        name: validateOnly
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nextgenv1beta2Tidb'
          description: A successful response.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: A request field is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: The credentials cannot be authenticated.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: The authenticated identity does not have permission to access
            the resource.
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: You have exceeded the rate limit.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: Internal server error.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: An unexpected error response.
      summary: Delete a TiDB Cloud Premium instance
      tags:
      - TiDB Cloud Premium Instance
      x-code-samples:
      - label: curl
        lang: curl
        source: |-
          curl --location --request DELETE 'https://cloud.tidbapi.com/v1beta2/tidbs/{tidb_id}' \
          --digest --user 'YOUR_PUBLIC_KEY:YOUR_PRIVATE_KEY' \
          --header 'Accept: application/json'
    get:
      description: Retrieves details of a specific TiDB Cloud Premium instance.
      operationId: TidbService_GetTidb
      parameters:
      - description: The ID of the TiDB Cloud Premium instance to retrieve.
        in: path
        name: tidbId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nextgenv1beta2Tidb'
          description: A successful response.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: A request field is invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: The credentials cannot be authenticated.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
          description: The authenticated identity does not have permission to access
